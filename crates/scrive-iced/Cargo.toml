[package]
name = "scrive-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "iced 0.14 integration for scrive: an `advanced::Widget` code editor with gutter, selections, syntax highlighting, diagnostics, completion, and hover. Wraps scrive-core."
keywords = ["editor", "iced", "widget", "text", "gui"]
categories = ["gui", "text-editors"]

[dependencies]
scrive-core.workspace = true
# The Language Server Protocol bridge behind the `lsp` feature, re-exported as
# `scrive_iced::lsp` and driven by the `CodeEditor` glue.
scrive-lsp = { workspace = true, optional = true }
# `advanced` unlocks the low-level `Widget` API (iced::advanced::*) the editor
# widget implements directly, rather than as a canvas::Program.
iced = { version = "0.15.0-dev", features = ["advanced"] }

# Language-server support: re-exports scrive-lsp as `scrive_iced::lsp` and adds
# the `CodeEditor` methods that drive a client. Off by default, so a host without
# a language server compiles none of it.
[features]
default = ["syntect"]
lsp = ["dep:scrive-lsp"]
# The WebSocket transport for the language-server client: `lsp::Client::builder().websocket(url)`,
# natively and in the browser. Pulls tungstenite and rustls on native targets.
lsp-websocket = ["lsp", "scrive-lsp/websocket"]
# Syntect highlighting: `CodeEditor::language` accepts a
# `scrive_core::SyntaxDef`, and big documents tokenize on worker threads.
# Forwards to scrive-core's backend.
syntect = ["scrive-core/syntect"]
# Tree-sitter highlighting: `CodeEditor::language` then also accepts a
# `scrive_core::TreeSitterDef`. Forwards to scrive-core's backend.
tree-sitter = ["scrive-core/tree-sitter"]

[dev-dependencies]
# Headless render-to-PNG for self-validation screenshots: construct a real
# `iced::Renderer` (fallback::Renderer::Secondary over tiny-skia) with no window
# or GPU and rasterize one frame. Available to examples + tests.
iced_renderer = { version = "0.15.0-dev", default-features = false }
iced_tiny_skia = { version = "0.15.0-dev", default-features = false }
iced_runtime = { version = "0.15.0-dev", default-features = false }
png = "0.17"
# Pure-Rust GIF encoder for the headless showcase recorder (record_showcase).
gif = "0.13"
# JSON-RPC fixtures: the glue tests write server replies as JSON and read the
# client's requests back as JSON.
serde_json = "1"

# In the browser the examples need WebGL (for browsers without WebGPU) and an
# embedded UI font, since the web offers no system fonts.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
iced = { version = "0.15.0-dev", features = ["webgl", "fira-sans"] }

# tree-sitter-rust: the grammar of the `tree_sitter` example and the
# `tree-sitter` feature's tests. Its build.rs predates the template that adds
# the wasm headers, so a wasm32-unknown-unknown build needs
# `eval "$(scripts/wasm-cflags.sh)"` first. Not on WASI, like scrive-core's.
[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
tree-sitter-rust = "0.24"

# The syntect examples highlight with the bundled `.sublime-syntax` grammar.
[[example]]
name = "minimal"
required-features = ["syntect"]

[[example]]
name = "scratch"
required-features = ["syntect"]
test = true

# Records the scratch example, which it includes.
[[example]]
name = "record_showcase"
required-features = ["syntect"]

[[example]]
name = "lsp"
path = "examples/lsp/main.rs"
required-features = ["lsp", "syntect"]
test = true

# Native only: spawns rust-analyzer from PATH. Its wasm32 build is a stub `main`.
[[example]]
name = "rust_analyzer"
required-features = ["lsp", "syntect"]
test = true

[[example]]
name = "tree_sitter"
required-features = ["tree-sitter"]

[package.metadata.docs.rs]
all-features = true
