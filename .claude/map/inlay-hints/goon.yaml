# Project configuration for /goon and /handoff.
# Generated by /map (inlay-hints). /handoff updates it as the project evolves.

project: scrive
description: >-
  A code editor widget for iced (headless scrive-core + scrive-iced widget + scrive-lsp client).
  This MAP adds LSP inlay hints: inline virtual text that shifts the line, anchored to the token it
  annotates, with hover tooltips, Ctrl+click label jumps and double-click insert.

# Tracking is local-only, as for lsp-bridge: progress lives in SESSION_HANDOFF.md's status table.
repo: NickelWenzel/scrive
milestone: none
default_branch: master
work_branch: lsp_bridge   # builds on the unreleased 0.4.0 work; breaking changes ride 0.4.0

handoff:
  dir: .claude/map/inlay-hints
  prefix: SESSION_HANDOFF

workspace:
  - name: scrive-core
    path: crates/scrive-core
    role: "library — headless core; gains intel::inlay, the anchored inlay store, row_layout::Rows/Edge and hint-aware RowLayout"
  - name: scrive-iced
    path: crates/scrive-iced
    role: "library — Editor/CodeEditor widget; paints hints, gestures, Editor::wake_after, the inlay scheduler and the lsp glue"
  - name: scrive-lsp
    path: crates/scrive-lsp
    role: "library — LSP client state machine; gains inlay fetch, refresh fan-out, resolve/tooltip/jump/insert"

architecture:
  - "scrive-iced → scrive-core"
  - "scrive-lsp → scrive-core (never scrive-iced)"
  - "scrive-iced[lsp] → scrive-lsp"

upstream:
  lsp_types: "0.97.0 (cached in ~/.cargo/registry; read its source, don't recall it)"
  rust_analyzer_probe: "02dede3ce5 (the measurements in MAP_PLAN 'rust-analyzer, measured')"

checklist:
  quick:
    - cargo test --workspace
  verify:
    - cargo test --workspace
    - cargo test --workspace --all-features
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
    - cargo build --workspace --all-targets --all-features --target wasm32-unknown-unknown
  lint:
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - for c in scrive-core scrive-lsp; do out=$(cargo tree -p $c -e normal --prefix none) || exit 1; if grep -qE '^(iced|winit|wgpu)' <<<"$out"; then echo "$c LEAK"; exit 1; fi; done

forbidden:
  - command: cargo fmt
    reason: the codebase is not rustfmt-clean. Only `rustfmt --edition 2021 <new file>`.
  - command: cargo run --example <name>
    reason: opens a GUI window and hangs a headless session — visual checks are the human's step
  - command: git commit / push / stash / checkout -- (phase agents)
    reason: the orchestrating session builds commits with patches/commit-phase.sh; phase agents never commit

key_files:
  - .claude/map/inlay-hints/SESSION_HANDOFF.md
  - .claude/map/inlay-hints/MAP_PLAN.md
  - .claude/map/inlay-hints/RESOLUTIONS.md
  - .claude/map/inlay-hints/DISPATCH.md         # phase agent dispatch preamble (Appendix A)
  - ~/.claude/guides/RUST_STYLE.md
  - ~/.claude/guides/OPAQUE.md
  - ~/.claude/skills/iced/SKILL.md
  - crates/scrive-core/src/decorations.rs       # DecorationStore, movers, Stickiness
  - crates/scrive-core/src/row_layout.rs        # RowLayout, HeaderLayout, projections
  - crates/scrive-core/src/document.rs          # rebase_views, selections, folds
  - crates/scrive-iced/src/editor.rs            # draw, hit test, hover arming, Action
  - crates/scrive-iced/src/code_editor.rs       # update/apply/after_edit, Awaiting
  - crates/scrive-iced/src/code_editor/lsp.rs   # sync_lsp, route, land
  - crates/scrive-lsp/src/client.rs             # Kind, Query, send, reissue, target

examples:
  - command: "cargo run -p scrive-iced --example lsp --features lsp"
    description: "(from Phase 7) scripted server with type/parameter/linked/insertable hints; Ctrl+I toggles"
  - command: "cargo run -p scrive-iced --example rust_analyzer --features lsp"
    description: "(from Phase 7) real hints from rust-analyzer; Ctrl+I toggles"

style:
  - "No AI attribution in commits, docs, or comments"
  - "No mod.rs — foo.rs + foo/; one semantic type per module; module paths over composite names"
  - "No unwrap() in library code — expect(\"invariant: …\") or let-else"
  - "Conventional Commits with scope: feat(core), feat(iced), feat(lsp), fix(iced), refactor(core), test(core), docs"
  - "Match local style by hand; comments per /commit-and-comment; every #[allow] justified"
  - "Tests: colocated, sentence names"

workflow:
  - "Phases run strictly sequentially 1 → 7; dispatch each with MAP_PLAN.md Appendix A + its MAP_PHASE_N.md + RESOLUTIONS.md"
  - "Agents write cumulative patches patches/phase<N>-<k>.patch + .msg; the orchestrator runs patches/commit-phase.sh <N> <base> --all-features"
  - "After each phase: review the diff vs exit criteria and 'What NOT to change', run verify + lint, update the handoff status table"
  - "A design decision the plan doesn't cover goes into .claude/DECISIONS.md before continuing"
