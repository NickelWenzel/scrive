# Project configuration for /goon and /handoff.
# Generated by /map (lsp-bridge). /handoff updates it as the project evolves.

project: scrive
description: >-
  A code editor widget for iced (headless scrive-core + scrive-iced widget). This MAP adds scrive-lsp,
  a transport-free LSP client state machine behind scrive-iced's `lsp` feature.

# GitHub. Tracking is local-only by choice: progress lives in SESSION_HANDOFF.md's status table.
# `origin` is robbym/scrive (upstream project); `upstream` is the user's fork NickelWenzel/scrive,
# which `gh` resolves by default. Nothing is created on GitHub for this MAP.
repo: NickelWenzel/scrive
milestone: none
default_branch: master
work_branch: lsp_bridge

handoff:
  dir: .claude/map/lsp-bridge
  prefix: SESSION_HANDOFF

workspace:
  - name: scrive-core
    path: crates/scrive-core
    role: "library — headless editor core (rope, transactions, history, decorations, intel seams). No GUI deps."
  - name: scrive-iced
    path: crates/scrive-iced
    role: "library — the iced CodeEditor/Editor widget; gains the `lsp` feature and glue in Phase 9"
  - name: scrive-lsp
    path: crates/scrive-lsp
    role: "library (created in Phase 4) — LSP client state machine: JSON-RPC envelope, sync, conversions. No GUI, no I/O."

architecture:
  - "scrive-iced → scrive-core"
  - "scrive-lsp → scrive-core (never scrive-iced; Cargo would reject the cycle)"
  - "scrive-iced[lsp] → scrive-lsp (optional dep, re-exported as scrive_iced::lsp)"

upstream:
  iced_rev: 10e9b995eb5af74dbac08ed62b01971fe7e495b2   # pinned via [patch.crates-io]; the pin is the contract
  lsp_types: "0.97.0 (cached in ~/.cargo/registry; read its source, don't recall it)"

checklist:
  # quick: on /goon. Baseline measured at HEAD 6cf4f2c — see SESSION_HANDOFF.md for timings.
  quick:
    - cargo test --workspace
  # verify: on /handoff and after each phase.
  verify:
    - cargo test --workspace
    - cargo test --workspace --all-features
    - RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features
    - cargo build --workspace --all-targets --all-features --target wasm32-unknown-unknown
  lint:
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    # Headless gate (meaningful from Phase 4 on):
    - for c in scrive-core scrive-lsp; do out=$(cargo tree -p $c -e normal --prefix none) || exit 1; if grep -qE '^(iced|winit|wgpu)' <<<"$out"; then echo "$c LEAK"; exit 1; fi; done
  # CI-only: `cargo test -p scrive-core -p scrive-lsp --lib --target wasm32-wasip1` (needs wasmtime; not installed locally).

# Commands an agent must NOT run unattended.
forbidden:
  - command: cargo fmt
    reason: the codebase is not rustfmt-clean (41 files would be rewritten). Only `rustfmt --edition 2021 <new file>`.
  - command: cargo run --example <name>
    reason: opens a GUI window and hangs a headless session — visual checks are the human's step
  - command: cargo update / editing the iced pin
    reason: the pinned rev is the contract
  - command: git commit / push / stash / checkout -- (phase agents)
    reason: the orchestrating session reviews, verifies, and commits; phase agents never do

key_files:
  - .claude/map/lsp-bridge/SESSION_HANDOFF.md
  - .claude/map/lsp-bridge/MAP_PLAN.md
  - ~/.claude/guides/RUST_STYLE.md
  - ~/.claude/guides/OPAQUE.md
  - ~/.claude/skills/iced/SKILL.md
  - crates/scrive-core/src/document.rs          # change log, undo/redo, jump verbs
  - crates/scrive-core/src/buffer.rs            # Snapshot, Revision, DocId
  - crates/scrive-core/src/intel/providers.rs   # completion seam types
  - crates/scrive-core/src/intel/completion.rs  # CompletionController
  - crates/scrive-iced/src/code_editor.rs       # CodeEditor: async seam, find bar, accept path
  - crates/scrive-iced/src/editor.rs            # widget State, key handling, hover arming, markdown
  - .github/workflows/ci.yml

examples:
  - command: "cargo run -p scrive-iced --example lsp --features lsp"
    description: "(from Phase 10) two tabs on a scripted LSP server: diagnostics, completion, signature, hover, F12, F2, Shift+Alt+F, traffic panel"
  - command: "cd crates/scrive-iced && trunk serve --release --example lsp --features lsp"
    description: "(from Phase 10) the same in the browser"
  - command: "cargo run -p scrive-iced --example minimal"
    description: "existing minimal CodeEditor integration"

style:
  - "No AI attribution in commits, docs, or comments"
  - "Edition 2021 (workspace), no MSRV; version bumps to 0.4.0 in Phase 10"
  - "No mod.rs — foo.rs + foo/"
  - "No unwrap() in library code — expect(\"invariant: …\") or let-else"
  - "Conventional Commits with scope: feat(lsp), fix(core), feat(iced), ci, docs"
  - "Match local style by hand in existing files; comments are why-prose (~25% density); every #[allow] justified"
  - "Tests: colocated, sentence names, /// invariant doc, string assert messages"

workflow:
  - "Phases run strictly sequentially 1 → 10; dispatch each with MAP_PLAN.md Appendix A + its MAP_PHASE_N.md"
  - "After each phase: review diff vs exit criteria and 'What NOT to change', run verify + lint, commit on lsp_bridge, update the handoff status table"
  - "If a phase agent reports a design decision the plan doesn't cover, log it in .claude/DECISIONS.md (D-entry format from ~/.claude/guides/DECISIONS.md) before continuing"
