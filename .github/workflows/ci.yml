name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Unit, integration (a headless iced runtime — no window or GPU needed),
      # and the compiled doc examples.
      - name: Test workspace
        run: cargo test --workspace

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      # The browser target: the library, its tests, and the examples must build.
      - name: Build for wasm32-unknown-unknown
        run: cargo build --workspace --all-targets --target wasm32-unknown-unknown

      # The GUI-free core runs its unit tests as wasm (32-bit usize, no threads).
      - name: Test scrive-core on wasm32-wasip1
        run: cargo test -p scrive-core --lib --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

      # The LSP client is headless too; its unit tests run as wasm the same way.
      - name: Test scrive-lsp on wasm32-wasip1
        run: cargo test -p scrive-lsp --lib --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  lints:
    name: Lints & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Missing docs and broken intra-doc links are denied at the crate level;
      # this catches every other rustdoc warning.
      - name: Docs build clean
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # The headless crates must never pull a GUI crate into their normal
      # dependency graph. `cargo tree` failing is itself a failure.
      - name: Headless crates depend on no GUI crate
        shell: bash
        run: |
          for c in scrive-core scrive-lsp; do
            out=$(cargo tree -p "$c" -e normal --prefix none) || exit 1
            if grep -qE '^(iced|winit|wgpu)' <<<"$out"; then
              echo "$c depends on a GUI crate"
              exit 1
            fi
          done
