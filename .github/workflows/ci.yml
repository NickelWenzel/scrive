name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Unit, integration (a headless iced runtime — no window or GPU needed),
      # and the compiled doc examples.
      - name: Test workspace
        run: cargo test --workspace

      # The `lsp` feature's glue and its tests compile only with it.
      - name: Test workspace (all features)
        run: cargo test --workspace --all-features

      # The tree-sitter backend alone, with syntect out of the build.
      - name: Test scrive-core and scrive-iced (tree-sitter only)
        run: cargo test -p scrive-core -p scrive-iced --no-default-features --features tree-sitter

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      # tree-sitter-rust (a test grammar) predates the grammar template that
      # adds the wasm libc headers itself; point its C compiler at them.
      - name: Set wasm CFLAGS for tree-sitter grammars
        run: scripts/wasm-cflags.sh | sed 's/^export //; s/"//g' >> "$GITHUB_ENV"

      # The browser target: the libraries (every feature), their tests, and the
      # examples must build.
      - name: Build for wasm32-unknown-unknown
        run: cargo build --workspace --all-targets --all-features --target wasm32-unknown-unknown

      # The tree-sitter backend runs in the browser target, with no imports.
      - name: Run the tree-sitter wasm smoke test
        run: node scripts/wasm-smoke.mjs target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm

      # The GUI-free core runs its unit tests as wasm (32-bit usize, no threads).
      - name: Test scrive-core on wasm32-wasip1
        run: cargo test -p scrive-core --lib --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

      # The LSP client is headless too; its unit tests run as wasm the same way.
      - name: Test scrive-lsp on wasm32-wasip1
        run: cargo test -p scrive-lsp --lib --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  lints:
    name: Lints & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The glue is `cfg(feature = "lsp")`: lint it too.
      - name: Clippy, all features (no warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The highlight backends are features; lint the builds that drop syntect.
      - name: Clippy, no highlight backend (no warnings)
        run: cargo clippy -p scrive-core -p scrive-iced --all-targets --no-default-features -- -D warnings

      - name: Clippy, tree-sitter only (no warnings)
        run: cargo clippy -p scrive-core -p scrive-iced --all-targets --no-default-features --features tree-sitter -- -D warnings

      # Missing docs and broken intra-doc links are denied at the crate level;
      # this catches every other rustdoc warning.
      - name: Docs build clean
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # The default build above catches links to gated items from ungated docs;
      # this one checks the gated docs themselves.
      - name: Docs build clean (all features)
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # Docs that link to syntect-only items break here.
      - name: Docs build clean (tree-sitter only)
        run: cargo doc --no-deps -p scrive-core -p scrive-iced --no-default-features --features tree-sitter
        env:
          RUSTDOCFLAGS: -D warnings

      # The headless crates must never pull a GUI crate into their normal
      # dependency graph. `cargo tree` failing is itself a failure.
      - name: Headless crates depend on no GUI crate
        shell: bash
        run: |
          for c in scrive-core scrive-lsp; do
            out=$(cargo tree -p "$c" -e normal --prefix none) || exit 1
            if grep -qE '^(iced|winit|wgpu)' <<<"$out"; then
              echo "$c depends on a GUI crate"
              exit 1
            fi
          done

      # A tree-sitter-only consumer must be able to drop syntect entirely.
      - name: Tree-sitter-only builds pull in no syntect
        shell: bash
        run: |
          for c in scrive-core scrive-iced; do
            out=$(cargo tree -p "$c" --no-default-features --features tree-sitter -e normal --prefix none) || exit 1
            if grep -q '^syntect ' <<<"$out"; then
              echo "$c pulls in syntect without the syntect feature"
              exit 1
            fi
          done
